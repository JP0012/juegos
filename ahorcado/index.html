    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ahorcado</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="contenedor">


<header>

    <h1>🎯 AHORCADO</h1>


    <a href="../index.html" class="volver">
        ← Menú Principal
    </a>


</header>



<div class="panel">


    <!-- CANVAS DEL AHORCADO -->

    <div class="izquierda">


        <canvas id="canvas"
                width="300"
                height="350">
        </canvas>


    </div>





    <!-- INFORMACIÓN DEL JUEGO -->

    <div class="derecha">



        <div class="estadisticas">


            <div class="dato">

                🏆 Ganadas:
                <span id="ganadas">
                    0
                </span>

            </div>



            <div class="dato">

                💀 Perdidas:
                <span id="perdidas">
                    0
                </span>

            </div>



            <div class="dato">

                ⭐ Puntos:
                <span id="puntos">
                    0
                </span>

            </div>



            <div class="dato">

                🔥 Racha:
                <span id="racha">
                    0
                </span>

            </div>



        </div>





        <div class="controles">


            <select id="dificultad">


                <option value="facil">
                    Fácil
                </option>


                <option value="medio">
                    Medio
                </option>


                <option value="dificil">
                    Difícil
                </option>


            </select>




            <button id="pista">

                💡 Pista

            </button>


        </div>






        <div class="categoria">


            Categoría:

            <span id="categoria">

                ---

            </span>


        </div>







        <div id="pistaTexto"
             class="pista-texto">

        </div>








        <div id="palabra"
             class="palabra">

        </div>








        <div class="contenedor-vidas">



            <div id="vidas"
                 class="vidas">

                ❤️❤️❤️❤️❤️❤️

            </div>




            <div class="barra">


                <div id="progreso"
                     class="progreso">

                </div>


            </div>



        </div>







        <div id="mensaje"
             class="mensaje">

        </div>




    </div>



</div>







<!-- TECLADO -->

<div id="teclado"
     class="teclado">

</div>







<!-- BOTONES -->

<div class="botones-finales">


    <button id="nuevo">

        Nueva partida

    </button>



    <button id="desconectar">

        🚪 Desconectarse

    </button>


</div>





</div>


<script src="js/palabras.js"></script>
<script src="js/dibujo.js"></script>
<script src="js/estadisticas.js"></script>
<script src="js/interfaz.js"></script>
<script src="js/sonidos.js"></script>
<script src="js/utilidades.js"></script>
<script src="js/script.js"></script>

</body>

</html>
